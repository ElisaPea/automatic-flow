packages:
  - apps/*
  - packages/*

# Expo/Metro necesita node_modules "planos" para resolver dependencias nativas.
nodeLinker: hoisted
autoInstallPeers: true

allowBuilds:
  '@swc/core': true
  browser-tabs-lock: false
  core-js: false
  esbuild: true
minimumReleaseAgeExclude:
  - '@clerk/backend@3.31.1'
  - '@clerk/express@2.1.93'
  - '@clerk/nextjs@7.10.4'
  - '@clerk/react@6.19.1'
  - '@clerk/shared@4.48.0'
  - '@turbo/darwin-64@2.11.13'
  - '@turbo/darwin-arm64@2.11.13'
  - '@turbo/linux-64@2.11.13'
  - '@turbo/linux-arm64@2.11.13'
  - '@turbo/windows-64@2.11.13'
  - '@turbo/windows-arm64@2.11.13'
  - turbo@2.11.13
